<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline · SeatLock</title>
<style>
  :root { --bg:#F8F9FC; --surface:#FFFFFF; --text:#111827; --text-2:#475467; --brand:#5146DD; --border:rgb(17 24 39 / .1); color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#080B13; --surface:#111623; --text:#F6F7FB; --text-2:#A7B3C4; --brand:#7065FF; --border:rgb(255 255 255 / .09); } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:1rem; background:var(--bg); color:var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; line-height:1.55;
    background-image: radial-gradient(60% 50% at 50% -10%, color-mix(in srgb, var(--brand) 25%, transparent), transparent 70%); }
  main { width:min(420px,100%); text-align:center; padding:2.5rem 1.5rem; border-radius:28px; background:var(--surface); border:1px solid var(--border); }
  svg { margin:0 auto 1.25rem; }
  h1 { margin:0 0 .5rem; font-size:1.75rem; letter-spacing:-.03em; }
  p { margin:0 0 1.5rem; color:var(--text-2); }
  button { min-height:48px; padding:0 2rem; border:0; border-radius:999px; background:var(--brand); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:focus-visible { outline:3px solid #D5FF73; outline-offset:3px; }
</style>
</head>
<body>
<main>
  <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7065FF"/><stop offset="1" stop-color="#81D9FF"/></linearGradient></defs>
    <rect width="32" height="32" rx="9" fill="url(#g)"/>
    <path d="M9 16v-4a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v4" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <rect x="7" y="16" width="18" height="6" rx="2" fill="#fff"/>
  </svg>
  <h1>You’re offline</h1>
  <p>SeatLock needs a connection to show live seat availability. Your bookings are safe — reconnect and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
